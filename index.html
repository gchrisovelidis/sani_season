<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sani Season</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F4F6FA;
      --surface:      #FFFFFF;
      --surface2:     #F0F3FA;
      --border:       #E4E9F2;

      --text:         #18223A;
      --muted:        #7A87A8;
      --label:        #9BA8C4;

      --accent:       #1E5FDB;
      --warn:         #C47A0A;
      --danger:       #B83333;
      --success:      #1A7A48;
      --weekend:      #0D6E6E;

      --temp-cold:    #2563EB;
      --temp-mild:    #475569;
      --temp-warm:    #C47A0A;
      --temp-hot:     #C2410C;
      --temp-na:      #9BA8C4;

      --cond-clear:   #D97706;
      --cond-cloud:   #64748B;
      --cond-rain:    #2563EB;
      --cond-mist:    #94A3B8;

      --prog-bg:      #E8EDF8;
      --prog1:        #1E5FDB;
      --prog2:        #5B8FF5;

      --open-c:       #15803D;
      --open-bg:      rgba(21,128,61,0.10);
      --upcoming-c:   #B45309;
      --upcoming-bg:  rgba(180,83,9,0.10);
      --closed-c:     #6B7280;
      --closed-bg:    rgba(107,114,128,0.10);

      --font: 'Outfit', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── LAYOUT ── */
    .page {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .col {
      display: flex;
      flex-direction: column;
      padding: 28px 22px;
    }

    .col-left {
      width: 27%;
      min-width: 255px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }

    .col-mid {
      flex: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .col-right {
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      max-height: 100vh;
      width: 100%;
    }

    /* ── SECTION CHROME ── */
    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--label);
      text-transform: uppercase;
      letter-spacing: 1.1px;
      margin-bottom: 12px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    /* ── WEATHER ── */
    .weather-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }

    .weather-city {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .weather-cond {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
      color: var(--muted);
    }
    .weather-cond svg { width: 12px; height: 12px; flex-shrink: 0; }

    .weather-temp {
      font-size: 18px;
      font-weight: 700;
      font-family: var(--mono);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .temp-cold  { color: var(--temp-cold); }
    .temp-mild  { color: var(--temp-mild); }
    .temp-warm  { color: var(--temp-warm); }
    .temp-hot   { color: var(--temp-hot); }
    .temp-na    { color: var(--temp-na); }

    .cond-clear   { color: var(--cond-clear)  !important; }
    .cond-cloud   { color: var(--cond-cloud)  !important; }
    .cond-rain    { color: var(--cond-rain)   !important; }
    .cond-drizzle { color: #60A5FA            !important; }
    .cond-thunder { color: #7C3AED            !important; }
    .cond-snow    { color: #93C5FD            !important; }
    .cond-mist    { color: var(--cond-mist)   !important; }

    /* ── INFO CARDS ── */
    .info-card {
      background: var(--surface2);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }

    .info-card .card-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--label);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .info-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .info-days {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--mono);
      line-height: 1;
    }

    .c-normal  { color: var(--text); }
    .c-warn    { color: var(--warn); }
    .c-danger  { color: var(--danger); }
    .c-weekend { color: var(--weekend); }
    .c-accent  { color: var(--accent); }
    .c-success { color: var(--success); }

    /* ── MIDDLE ── */
    .mid-content {
      text-align: center;
      width: 100%;
      max-width: 400px;
      padding: 24px 16px;
    }

    .logo-wrap { margin-bottom: 28px; }
    .logo-wrap img {
      width: 200px;
      max-width: 55vw;
      height: auto;
      pointer-events: none;
      user-select: none;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .mid-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--label);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .clock, .countdown, .days-big {
      font-family: var(--mono);
      font-weight: 600;
      line-height: 1;
      color: var(--text);
    }
    .clock     { font-size: 64px; margin-bottom: 28px; }
    .countdown { font-size: 56px; margin-bottom: 28px; }
    .days-big  { font-size: 64px; margin-bottom: 22px; }

    @media (max-width: 1200px) {
      .clock, .countdown, .days-big { font-size: 48px; }
    }

    /* ── SEASON PROGRESS ── */
    .season-progress { margin-top: 2px; }

    .prog-bar {
      width: 100%;
      height: 10px;
      background: var(--prog-bg);
      border-radius: 999px;
      overflow: hidden;
      margin: 7px 0 5px;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--prog1) 0%, var(--prog2) 100%);
      border-radius: 999px;
      transition: width 0.8s ease;
    }
    .prog-pct {
      font-size: 13px;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--muted);
    }

    /* ── RESORTS ── */
    .resort-group { margin-bottom: 16px; }

    .resort-group-title {
      font-size: 9px;
      font-weight: 700;
      color: var(--label);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .resort-item { margin-bottom: 9px; }
    .resort-item:last-child { margin-bottom: 0; }

    .resort-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .resort-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .resort-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-open     { color: var(--open-c);    background: var(--open-bg); }
    .badge-upcoming { color: var(--upcoming-c); background: var(--upcoming-bg); }
    .badge-closed   { color: var(--closed-c);   background: var(--closed-bg); }

    .resort-dates {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .resort-prog-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .resort-prog-bar {
      flex: 1;
      height: 5px;
      background: var(--prog-bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .resort-prog-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease;
    }
    .fill-upcoming { background: #F59E0B; }
    .fill-open     { background: linear-gradient(90deg, #16A34A, #22C55E); }
    .fill-closed   { background: #9CA3AF; }

    .resort-prog-pct {
      font-size: 10px;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--muted);
      min-width: 30px;
      text-align: right;
    }

    /* ── STICKER ── */
    .sticker-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--border);
      display: inline-block;
      margin-top: 16px;
      box-shadow: 0 2px 12px rgba(24,34,58,0.10);
    }
    .sticker-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      display: block;
    }

    /* ── RIGHT COL SCROLL FADE ── */
    .col-right-wrap {
      position: relative;
      width: 27%;
      min-width: 255px;
      flex-shrink: 0;
    }
    .col-right-wrap::after {
      content: '';
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      display: block;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.97) 100%);
      pointer-events: none;
      flex-shrink: 0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .page { flex-direction: column; }
      .col-left, .col-right-wrap {
        width: 100% !important;
        min-width: 0 !important;
      }
      .col-right {
        border: none !important;
        max-height: none !important;
        overflow: visible !important;
      }
      .col-right-wrap::after { display: none; }
      .col-left  { border-bottom: 1px solid var(--border) !important; border-right: none !important; }
      .col-right { border-top:    1px solid var(--border) !important; border-left: none !important; }
      .col-mid   { padding: 28px 20px; }
      .clock, .countdown, .days-big { font-size: 38px; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- LEFT -->
  <div class="col col-left">

    <div class="section-title">Weather · Offices</div>
    <div id="weather-offices"></div>

    <div class="divider"></div>

    <div class="section-title">Weather · Properties</div>
    <div id="weather-properties"></div>

    <div class="divider"></div>

    <div id="holiday-section"></div>

    <div class="divider"></div>

    <div id="weekend-section"></div>

  </div>

  <!-- MIDDLE -->
  <div class="col col-mid">
    <div class="mid-content">

      <div class="logo-wrap" id="logo-wrap">
        <div class="logo-text">⛱ Sani Season</div>
      </div>

      <div class="mid-label">Current time</div>
      <div class="clock" id="live-clock">--:--</div>

      <div id="countdown-wrap" style="display:none;">
        <div class="mid-label">Time until 17:30</div>
        <div class="countdown" id="live-countdown">0h 00m</div>
      </div>

      <div class="mid-label">Days until 7 November 2026</div>
      <div class="days-big" id="days-remaining">—</div>

      <div class="season-progress">
        <div class="mid-label">Season Progress</div>
        <div class="prog-bar"><div class="prog-fill" id="season-fill" style="width:0%"></div></div>
        <div class="prog-pct" id="season-pct">0%</div>
        <div id="season-sticker" style="text-align:center;display:none;">
          <div class="sticker-circle"><img id="sticker-img" alt=""></div>
        </div>
      </div>

    </div>
  </div>

  <!-- RIGHT -->
  <div class="col-right-wrap">
  <div class="col col-right">

    <div id="duetto-section"></div>

    <div class="divider"></div>

    <div class="info-card">
      <div class="card-label">E-commerce goes offline</div>
      <div class="info-name c-normal">Unknown</div>
    </div>

    <div class="divider"></div>

    <div id="resort-section"></div>

  </div>
  </div>
</div>

<script src="stickers.js"></script>
<script>
// ── CONFIG ──────────────────────────────────────────────────
const CONFIG = {
  TARGET_DATE:      '2026-11-07',
  SEASON_START:     '2026-03-26',
  DUETTO_LIVE_DATE: '2026-05-05',
  WORK_START: { h: 9,  m: 0 },
  WORK_END:   { h: 17, m: 30 },
  TIMEZONE:   'Europe/Athens',
};

const OFFICE_LOCATIONS = {
  'Thessaloniki': 'Thessaloniki,GR',
};

const PROPERTY_LOCATIONS = {
  'Halkidiki': 'Polygyros,GR',
  'Corfu':     'Kerkyra,GR',
  'Kos':       'Kos,GR',
  'Crete':     'Heraklion,GR',
  'Marbella':  'Marbella,ES',
  'Mallorca':  'Palma,ES',
};

const BANK_HOLIDAYS = [
  { date: '2026-01-01', name: "New Year's Day" },
  { date: '2026-01-06', name: 'Θεοφάνεια' },
  { date: '2026-02-23', name: 'Καθαρά Δευτέρα' },
  { date: '2026-03-25', name: '25η Μαρτίου' },
  { date: '2026-04-13', name: 'Δευτέρα του Πάσχα' },
  { date: '2026-05-01', name: 'Πρωτομαγιά' },
  { date: '2026-08-15', name: 'Κοίμηση της Θεοτόκου' },
  { date: '2026-10-28', name: '28η Οκτωβρίου' },
  { date: '2026-12-25', name: 'Χριστούγεννα' },
  { date: '2026-12-26', name: '2η μέρα Χριστουγέννων' },
];

const RESORTS = {
  'Sani Resort': [
    { name: 'Sani Beach',    open: '2026-04-02', close: '2026-10-31' },
    { name: 'Porto Sani',    open: '2026-04-02', close: '2026-10-31' },
    { name: 'Sani Dunes',    open: '2026-04-16', close: '2026-10-31' },
    { name: 'Sani Club',     open: '2026-04-23', close: '2026-10-31' },
    { name: 'Sani Asterias', open: '2026-04-30', close: '2026-10-31' },
  ],
  'Ikos Resorts': [
    { name: 'Ikos Oceania',     open: '2026-03-26', close: '2026-10-31' },
    { name: 'Ikos Olivia',      open: '2026-04-02', close: '2026-10-31' },
    { name: 'Ikos Dassia',      open: '2026-04-02', close: '2026-10-31' },
    { name: 'Ikos Aria',        open: '2026-04-23', close: '2026-10-31' },
    { name: 'Ikos Odisia',      open: '2026-04-23', close: '2026-10-31' },
    { name: 'Ikos Kissamos',    open: '2026-04-30', close: '2026-10-31' },
    { name: 'Ikos Andalusia',   open: '2026-03-26', close: '2026-11-07' },
    { name: 'Ikos Porto Petro', open: '2026-04-10', close: '2026-11-07' },
  ],
};

// ── DATE HELPERS ─────────────────────────────────────────────
function getAthensNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: CONFIG.TIMEZONE }));
}
function toDateObj(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtShortDate(str) {
  const d = toDateObj(str);
  return d.getDate() + ' ' + d.toLocaleString('en-GB', { month: 'short' });
}
function todayLocal() {
  const n = getAthensNow();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function diffDays(d1, d2) {
  return Math.round((d2 - d1) / 86400000);
}

// ── WEATHER ICONS ────────────────────────────────────────────
const WEATHER_ICONS = {
  Clear:        `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="#F5B301"/><g stroke="#F5B301" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="5.2"/><line x1="12" y1="18.8" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5.2" y2="12"/><line x1="18.8" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="16.9" y1="7.1" x2="18.8" y2="5.2"/><line x1="5.2" y1="18.8" x2="7.1" y2="16.9"/></g></svg>`,
  Clouds:       `<svg viewBox="0 0 24 24"><ellipse cx="10" cy="13.2" rx="5.2" ry="3.4" fill="#C8D0DF"/><ellipse cx="14.8" cy="12.8" rx="4.5" ry="3.1" fill="#B5C0D3"/><ellipse cx="7.2" cy="14.1" rx="3.2" ry="2.5" fill="#D6DDE9"/></svg>`,
  Rain:         `<svg viewBox="0 0 24 24"><ellipse cx="10" cy="10.8" rx="5.2" ry="3.4" fill="#C8D0DF"/><ellipse cx="14.8" cy="10.4" rx="4.5" ry="3.1" fill="#B5C0D3"/><g stroke="#4A90E2" stroke-width="1.8" stroke-linecap="round"><line x1="8" y1="15.2" x2="6.8" y2="18.2"/><line x1="12" y1="15.2" x2="10.8" y2="18.2"/><line x1="16" y1="15.2" x2="14.8" y2="18.2"/></g></svg>`,
  Drizzle:      `<svg viewBox="0 0 24 24"><ellipse cx="10" cy="10.8" rx="5.2" ry="3.4" fill="#C8D0DF"/><ellipse cx="14.8" cy="10.4" rx="4.5" ry="3.1" fill="#B5C0D3"/><g stroke="#67A7EF" stroke-width="1.5" stroke-linecap="round"><line x1="9" y1="15.5" x2="8.2" y2="17.4"/><line x1="13" y1="15.5" x2="12.2" y2="17.4"/><line x1="17" y1="15.5" x2="16.2" y2="17.4"/></g></svg>`,
  Thunderstorm: `<svg viewBox="0 0 24 24"><ellipse cx="10" cy="10.8" rx="5.2" ry="3.4" fill="#C8D0DF"/><ellipse cx="14.8" cy="10.4" rx="4.5" ry="3.1" fill="#B5C0D3"/><polygon points="12,14.4 9.5,18.6 12.4,18.6 10.8,21.4 15.2,16.6 12.4,16.6 14,14.4" fill="#F5B301"/></svg>`,
  Snow:         `<svg viewBox="0 0 24 24"><ellipse cx="10" cy="10.8" rx="5.2" ry="3.4" fill="#C8D0DF"/><ellipse cx="14.8" cy="10.4" rx="4.5" ry="3.1" fill="#B5C0D3"/><g stroke="#7FB7FF" stroke-width="1.4" stroke-linecap="round"><line x1="8" y1="15.4" x2="8" y2="18.2"/><line x1="6.6" y1="16.8" x2="9.4" y2="16.8"/><line x1="12.5" y1="15.4" x2="12.5" y2="18.2"/><line x1="11.1" y1="16.8" x2="13.9" y2="16.8"/></g></svg>`,
  Mist:         `<svg viewBox="0 0 24 24"><g stroke="#B8C2D1" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="8" x2="19" y2="8"/><line x1="3.5" y1="12" x2="17.5" y2="12"/><line x1="6.5" y1="16" x2="20.5" y2="16"/></g></svg>`,
  Unavailable:  `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#D3D8E2"/></svg>`,
};

const COND_CLASS = {
  clear: 'cond-clear', clouds: 'cond-cloud', rain: 'cond-rain',
  drizzle: 'cond-drizzle', thunderstorm: 'cond-thunder',
  snow: 'cond-snow', mist: 'cond-mist', fog: 'cond-mist', haze: 'cond-mist',
};

function iconFor(w)   { return WEATHER_ICONS[w] || WEATHER_ICONS.Unavailable; }
function condClass(w) { return COND_CLASS[(w||'').toLowerCase()] || 'cond-cloud'; }
function tempClass(t) {
  if (t === null) return 'temp-na';
  if (t <= 10)    return 'temp-cold';
  if (t <= 19)    return 'temp-mild';
  if (t <= 27)    return 'temp-warm';
  return 'temp-hot';
}

// ── WEATHER FETCH ────────────────────────────────────────────
const weatherCache = {};

async function fetchWeather(query) {
  if (weatherCache[query]) return weatherCache[query];
  const key = 'd805d1b72732447e104093c3559d7f13';
  try {
    const r = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(query)}&appid=${key}&units=metric`);
    const d = await r.json();
    if (d.cod !== 200) return null;
    const result = { temp: Math.round(d.main.temp), weather: d.weather[0].main };
    weatherCache[query] = result;
    return result;
  } catch { return null; }
}

function weatherRowHTML(label, data) {
  if (!data) {
    return `<div class="weather-row">
      <div>
        <div class="weather-city">${label}</div>
        <div class="weather-cond cond-mist">${iconFor('Unavailable')}<span>—</span></div>
      </div>
      <div class="weather-temp temp-na">—</div>
    </div>`;
  }
  const cc = condClass(data.weather);
  const tc = tempClass(data.temp);
  return `<div class="weather-row">
    <div>
      <div class="weather-city">${label}</div>
      <div class="weather-cond ${cc}">${iconFor(data.weather)}<span>${data.weather}</span></div>
    </div>
    <div class="weather-temp ${tc}">${data.temp}°C</div>
  </div>`;
}

async function renderWeather(locations, containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = Object.keys(locations).map(l => weatherRowHTML(l, null)).join('');
  const allData = {};
  await Promise.all(Object.entries(locations).map(async ([label, query]) => {
    allData[label] = await fetchWeather(query);
  }));
  el.innerHTML = Object.entries(allData).map(([l, d]) => weatherRowHTML(l, d)).join('');
}

async function loadAllWeather() {
  await Promise.all([
    renderWeather(OFFICE_LOCATIONS, 'weather-offices'),
    renderWeather(PROPERTY_LOCATIONS, 'weather-properties'),
  ]);
}

// ── STATIC SECTIONS ──────────────────────────────────────────
function alertClass(days) {
  if (days < 3)  return 'c-danger';
  if (days <= 7) return 'c-warn';
  return 'c-normal';
}

function formatDays(n) {
  if (n < 0)   return 'Live';
  if (n === 0) return 'Today';
  if (n === 1) return '1 day';
  return `${n} days`;
}

function renderHoliday(today) {
  const el = document.getElementById('holiday-section');
  const upcoming = BANK_HOLIDAYS
    .map(h => ({ ...h, d: toDateObj(h.date) }))
    .filter(h => h.d >= today)
    .sort((a, b) => a.d - b.d);
  if (!upcoming.length) { el.innerHTML = ''; return; }
  const next = upcoming[0];
  const days = diffDays(today, next.d);
  el.innerHTML = `
    <div class="info-card">
      <div class="card-label">Next Bank Holiday</div>
      <div class="info-name c-weekend">${next.name}</div>
      <div class="info-days c-weekend">${formatDays(days)}</div>
    </div>`;
}

function renderWeekend(today) {
  const el = document.getElementById('weekend-section');
  const wd = today.getDay();
  let name, daysText, cls;
  if (wd === 0 || wd === 6) {
    name = 'Weekend'; daysText = 'Today'; cls = 'c-weekend';
  } else {
    const toSat = 6 - wd;
    name = 'Next weekend';
    daysText = toSat === 1 ? 'Tomorrow' : `${toSat} days`;
    cls = toSat === 1 ? 'c-warn' : 'c-accent';
  }
  el.innerHTML = `
    <div class="info-card">
      <div class="card-label">Weekend Indicator</div>
      <div class="info-name ${cls}">${name}</div>
      <div class="info-days ${cls}">${daysText}</div>
    </div>`;
}

function renderDuetto(today) {
  const duetto = toDateObj(CONFIG.DUETTO_LIVE_DATE);
  const days = diffDays(today, duetto);
  const gone = days < 0;
  const cls = gone ? 'c-success' : alertClass(days);
  document.getElementById('duetto-section').innerHTML = `
    <div class="info-card">
      <div class="card-label">Duetto goes live</div>
      <div class="info-name ${cls}">5 May 2026</div>
      <div class="info-days ${cls}">${gone ? 'Live ✓' : formatDays(days)}</div>
    </div>`;
}

// ── RESORT PROGRESS ──────────────────────────────────────────
function resortStatus(today, openStr, closeStr) {
  const o = toDateObj(openStr), c = toDateObj(closeStr);
  if (today < o) return { status: 'Upcoming', pct: 0,   cls: 'upcoming' };
  if (today > c) return { status: 'Closed',   pct: 100, cls: 'closed' };
  const total   = diffDays(o, c);
  const elapsed = diffDays(o, today);
  const pct = total > 0 ? Math.min(100, Math.max(0, Math.round((elapsed / total) * 100))) : 100;
  return { status: 'Open', pct, cls: 'open' };
}

function renderResorts(today) {
  const el = document.getElementById('resort-section');
  let html = '<div class="section-title">Resort Season Progress</div>';
  for (const [group, resorts] of Object.entries(RESORTS)) {
    html += `<div class="resort-group"><div class="resort-group-title">${group}</div>`;
    for (const r of resorts) {
      const { status, pct, cls } = resortStatus(today, r.open, r.close);
      html += `
        <div class="resort-item">
          <div class="resort-top">
            <div class="resort-name">${r.name}</div>
            <div class="resort-badge badge-${cls}">${status}</div>
          </div>
          <div class="resort-dates">${fmtShortDate(r.open)} – ${fmtShortDate(r.close)}</div>
          <div class="resort-prog-row">
            <div class="resort-prog-bar">
              <div class="resort-prog-fill fill-${cls}" style="width:${pct}%"></div>
            </div>
            <div class="resort-prog-pct">${pct}%</div>
          </div>
        </div>`;
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

// ── SEASON PROGRESS + STICKER ────────────────────────────────
function renderSeasonProgress(today) {
  const start  = toDateObj(CONFIG.SEASON_START);
  const target = toDateObj(CONFIG.TARGET_DATE);
  const total   = diffDays(start, target);
  const elapsed = diffDays(start, today);
  const pct = total > 0 ? Math.min(100, Math.max(0, Math.round((elapsed / total) * 100))) : 0;

  document.getElementById('season-fill').style.width = pct + '%';
  document.getElementById('season-pct').textContent  = pct + '%';

  const wrap = document.getElementById('season-sticker');
  const img  = document.getElementById('sticker-img');
  const key  = pct <= 20 ? 'sticker1' : pct <= 40 ? 'sticker2' : pct <= 60 ? 'sticker3' : pct <= 80 ? 'sticker4' : 'sticker5';
  const stickers = (typeof STICKERS !== 'undefined') ? STICKERS : {};
  const b64 = stickers[key];
  if (b64 && b64.length > 10 && img && wrap) {
    img.src = 'data:image/png;base64,' + b64;
    wrap.style.display = 'block';
  }
}

// ── LIVE CLOCK + COUNTDOWN ───────────────────────────────────
function pad2(n) { return String(n).padStart(2, '0'); }

function updateLive() {
  const now    = getAthensNow();
  const h = now.getHours(), m = now.getMinutes();
  const today  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = toDateObj(CONFIG.TARGET_DATE);

  document.getElementById('live-clock').textContent = `${pad2(h)}:${pad2(m)}`;

  const daysLeft = diffDays(today, target);
  document.getElementById('days-remaining').textContent =
    daysLeft > 0 ? `${daysLeft} days` : daysLeft === 0 ? 'Today' : 'Done';

  const { h: sh, m: sm } = CONFIG.WORK_START;
  const { h: eh, m: em } = CONFIG.WORK_END;
  const inWork = (h > sh || (h === sh && m >= sm)) && (h < eh || (h === eh && m <= em));
  const wrap = document.getElementById('countdown-wrap');
  if (inWork) {
    const rem = (eh * 60 + em) - (h * 60 + m);
    document.getElementById('live-countdown').textContent = `${Math.floor(rem/60)}h ${pad2(rem%60)}m`;
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
  }
}

// ── INIT ─────────────────────────────────────────────────────
(function init() {
  const today = todayLocal();
  renderHoliday(today);
  renderWeekend(today);
  renderDuetto(today);
  renderResorts(today);
  renderSeasonProgress(today);
  updateLive();
  setInterval(updateLive, 30000);
  loadAllWeather();
})();
</script>
</body>
